<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Список задач</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div id="app">
		<h1>Список задач</h1>
		<div class="task-input">
			<input class="task" type="text" id="taskInput" placeholder="Введите задачу...">
			<button class="add-button" id="addTask">Добавить</button>
		</div>
		<div class="filters">
			<button data-filter="all">Все</button>
			<button data-filter="completed">Выполненные</button>
			<button data-filter="pending">Невыполненные</button>
		</div>
		<ul id="taskList"></ul>
	</div>
	<script src="app.js"></script>
</body>

</html>
