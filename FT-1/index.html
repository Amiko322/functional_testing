<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <input type="text" id="display" readonly>
        </div>
        <div class="buttons">
            <button data-action="7">7</button>
            <button data-action="8">8</button>
            <button data-action="9">9</button>
            <button data-action="divide">/</button>
            
            <button data-action="4">4</button>
            <button data-action="5">5</button>
            <button data-action="6">6</button>
            <button data-action="multiply">*</button>
            
            <button data-action="1">1</button>
            <button data-action="2">2</button>
            <button data-action="3">3</button>
            <button data-action="subtract">-</button>
            
            <button data-action="0">0</button>
            <button data-action="power">xⁿ</button>
            <button data-action="sqrt">√</button>
            <button data-action="add">+</button>
            <button data-action="clear">C</button>
            <button data-action="equals">=</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
